version: '3.6'

services:
  mysql:
    image: mysql:8.0.39
    container_name: seatunnel-web-mysql
    restart: unless-stopped
    init: true
    pids_limit: -1

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-seatunnel_web}
      MYSQL_USER: ${MYSQL_USER:-seatunnel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      TZ: Asia/Shanghai

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00

    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"

    volumes:
      - ./mysql-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -uroot --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - seatunnel-web-network


  redis:
    image: redis:7.4-alpine
    container_name: seatunnel-web-redis
    restart: unless-stopped
    init: true
    pids_limit: -1

    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.bind}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}

    # Keep the cache bounded and persist it under ./redis-data. volatile-lru
    # evicts cached pages/profiles (all carry a TTL) but keeps epoch counters.
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --dir /data --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy volatile-lru --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes --dir /data --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy volatile-lru

    expose:
      - "6379"

    ports:
      - "${REDIS_BIND_ADDRESS:-0.0.0.0}:${REDIS_HOST_PORT:-36379}:6379"

    volumes:
      - ./redis-data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - seatunnel-web-network


  minio:
    image: quay.io/minio/minio:latest
    container_name: seatunnel-web-minio
    restart: unless-stopped
    init: true
    pids_limit: -1

    command: ["server", "/data", "--console-address", ":9001"]

    environment:
      TZ: Asia/Shanghai
      # This bind stack is single-tenant; application credentials initialize MinIO.
      MINIO_ROOT_USER: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ACCESS_KEY:?set MinIO access key in .env.bind}
      MINIO_ROOT_PASSWORD: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SECRET_KEY:?set MinIO secret key in .env.bind}

    ports:
      - "${MINIO_BIND_ADDRESS:-0.0.0.0}:${MINIO_HOST_PORT:-49000}:9000"
      - "${MINIO_BIND_ADDRESS:-0.0.0.0}:${MINIO_CONSOLE_HOST_PORT:-49001}:9001"

    volumes:
      - ./minio-data:/data

    # Create the bucket named by SEATUNNEL_WEB_FILE_UPLOAD_MINIO_BUCKET before uploads.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - seatunnel-web-network


  seatunnel-web-api:
    image: eclipse-temurin:21-jre-jammy
    container_name: seatunnel-web-api
    restart: unless-stopped
    init: true
    pids_limit: -1

    entrypoint: ["/opt/seatunnel-web/bin/run-seatunnel-web.sh"]

    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:
      TZ: Asia/Shanghai

      SEATUNNEL_WEB_HOME: /opt/seatunnel-web
      HOME: /root

      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}

      APP_OPTS: ${APP_OPTS:-}

      SPRING_AI_API_KEY: ${SPRING_AI_API_KEY:-}
      SPRING_AI_BASE_URL: ${SPRING_AI_BASE_URL:-}
      SPRING_AI_LLM_MODEL: ${SPRING_AI_LLM_MODEL:-}

      SERVER_PORT: 9527

      SPRING_PROFILES_ACTIVE: mysql

      SEATUNNEL_WEB_DATABASE_TYPE: mysql
      SEATUNNEL_WEB_DATABASE_HOST: mysql
      SEATUNNEL_WEB_DATABASE_PORT: 3306
      SEATUNNEL_WEB_DATABASE_NAME: ${MYSQL_DATABASE:-seatunnel_web}

      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-seatunnel_web}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-seatunnel}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-change_me}

      SPRING_FLYWAY_ENABLED: "true"

      # OpenMetadata read cache and data-inventory aggregates. The cache degrades to a
      # direct computation when Redis is unreachable, so the API deliberately does not
      # wait for the redis service.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-15}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.bind}

      SEATUNNEL_WEB_DATASOURCE_MASTER_KEY: ${SEATUNNEL_WEB_DATASOURCE_MASTER_KEY:?set SEATUNNEL_WEB_DATASOURCE_MASTER_KEY in .env.bind}

      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ENDPOINT: http://minio:9000
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ENDPOINT: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ENDPOINT:?set a MinIO LAN endpoint reachable by the Engine}
      SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_UPLOAD_ENDPOINT: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_UPLOAD_ENDPOINT:-}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_BUCKET: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_BUCKET:-seatunnel-web-upload}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ACCESS_KEY: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ACCESS_KEY:-}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SECRET_KEY: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SECRET_KEY:-}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ACCESS_KEY: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ACCESS_KEY:-}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_SECRET_KEY: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_SECRET_KEY:-}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ROOT_PREFIX: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ROOT_PREFIX:-seatunnel-web-upload}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SESSION_TTL_HOURS: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SESSION_TTL_HOURS:-24}

      # Leave the Engine extension override empty so DuckDB uses ~/.duckdb/extensions.
      # The Web container mounts its own copy at the same default location for catalog use.
      SEATUNNEL_WEB_DUCKDB_EXTENSION_DIR: ""
      SEATUNNEL_WEB_DUCKDB_CATALOG_EXTENSION_DIR: ""

      # Native DMP tools run only inside the Web container, with a private scratch directory.
      SEATUNNEL_WEB_OFFLINE_IMPORT_DIMP_PATH: ${SEATUNNEL_WEB_OFFLINE_IMPORT_DIMP_PATH:-/opt/native-clients/dm/bin/dimp}
      SEATUNNEL_WEB_OFFLINE_IMPORT_SYS_RESTORE_PATH: ${SEATUNNEL_WEB_OFFLINE_IMPORT_SYS_RESTORE_PATH:-/opt/native-clients/kingbase/bin/sys_restore}
      SEATUNNEL_WEB_OFFLINE_IMPORT_WORK_DIR: ${SEATUNNEL_WEB_OFFLINE_IMPORT_WORK_DIR:-/var/lib/seatunnel-web/offline-import}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "9527"

    volumes:
      - ./dist/seatunnel-web-1.0.0:/opt/seatunnel-web
      - seatunnel-web-logs:/opt/seatunnel-web/logs
      - seatunnel-web-jdbc-drivers:/opt/seatunnel-web/jdbc-drivers
      - ./native-client-bundle:/opt/native-clients:ro
      - ./duckdb-extensions:/root/.duckdb/extensions:ro
      - ./offline-import-work:/var/lib/seatunnel-web/offline-import

    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c '</dev/tcp/127.0.0.1/9527'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - seatunnel-web-network


  seatunnel-web:
    image: nginx:1.19.2
    container_name: seatunnel-web
    restart: unless-stopped
    init: true
    pids_limit: -1

    healthcheck:
      disable: true

    depends_on:
      seatunnel-web-api:
        condition: service_healthy

    ports:
      - "${SEATUNNEL_WEB_PORT:-9527}:80"

    volumes:
      - ./dist/seatunnel-web-1.0.0/web:/usr/share/nginx/html:ro
      - ./dist/seatunnel-web-1.0.0/conf/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - seatunnel-web-network


volumes:
  seatunnel-web-logs:
    name: seatunnel-web-logs

  seatunnel-web-jdbc-drivers:
    name: seatunnel-web-jdbc-drivers


networks:
  seatunnel-web-network:
    name: seatunnel-web-network
    driver: bridge
