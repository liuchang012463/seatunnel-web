services:
  seatunnel-web-api:
    image: ${SEATUNNEL_WEB_API_IMAGE:-seatunnel-web-api:latest}
    container_name: seatunnel-web-api
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime

    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
      APP_OPTS: ${APP_OPTS:-}

      SPRING_AI_API_KEY: ${SPRING_AI_API_KEY:-}
      SPRING_AI_BASE_URL: ${SPRING_AI_BASE_URL:-}
      SPRING_AI_LLM_MODEL: ${SPRING_AI_LLM_MODEL:-}

      SERVER_PORT: 9527
      SPRING_PROFILES_ACTIVE: mysql

      SEATUNNEL_WEB_DATABASE_TYPE: mysql
      SEATUNNEL_WEB_DATABASE_HOST: ${MYSQL_HOST:-host.docker.internal}
      SEATUNNEL_WEB_DATABASE_PORT: ${MYSQL_PORT:-3306}
      SEATUNNEL_WEB_DATABASE_NAME: ${MYSQL_DATABASE:-seatunnel_web}

      SPRING_DATASOURCE_URL: "jdbc:mysql://${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-seatunnel_web}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?set MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}

      SPRING_FLYWAY_ENABLED: "true"

      # OpenMetadata read cache and data-inventory aggregates. This compose file keeps
      # MySQL on the host, so it expects Redis there too; the cache degrades to a direct
      # computation when Redis is unreachable.
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-26379}
      REDIS_DATABASE: ${REDIS_DATABASE:-15}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      SEATUNNEL_WEB_DATASOURCE_MASTER_KEY: ${SEATUNNEL_WEB_DATASOURCE_MASTER_KEY:?set SEATUNNEL_WEB_DATASOURCE_MASTER_KEY}

      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ENDPOINT: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ENDPOINT:-http://host.docker.internal:9000}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ENDPOINT: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ENDPOINT:-http://82.157.22.233:19000}
      SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_UPLOAD_ENDPOINT: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_UPLOAD_ENDPOINT:-}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_BUCKET: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_BUCKET:-seatunnel-web-upload}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ACCESS_KEY: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ACCESS_KEY:-}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SECRET_KEY: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SECRET_KEY:-}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ACCESS_KEY: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ACCESS_KEY:-}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_SECRET_KEY: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_SECRET_KEY:-}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ROOT_PREFIX: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ROOT_PREFIX:-seatunnel-web-upload}
      SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SESSION_TTL_HOURS: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SESSION_TTL_HOURS:-24}

      # This path is read by DuckDB on Engine nodes; Web does not mount or access it.
      SEATUNNEL_WEB_DUCKDB_EXTENSION_DIR: ${SEATUNNEL_WEB_DUCKDB_EXTENSION_DIR:-}
      # Optional, separate extension directory mounted inside Web for SQLite catalog/preview.
      SEATUNNEL_WEB_DUCKDB_CATALOG_EXTENSION_DIR: ${SEATUNNEL_WEB_DUCKDB_CATALOG_EXTENSION_DIR:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "9527"

    volumes:
      - seatunnel-web-logs:/opt/seatunnel-web/logs
      - seatunnel-web-jdbc-drivers:/opt/seatunnel-web/jdbc-drivers

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9527/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  seatunnel-web:
    image: ${SEATUNNEL_WEB_IMAGE:-seatunnel-web:latest}
    container_name: seatunnel-web
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime

    healthcheck:
      disable: true

    depends_on:
      seatunnel-web-api:
        condition: service_healthy

    ports:
      - "${SEATUNNEL_WEB_PORT:-9001}:80"

volumes:
  seatunnel-web-logs:
  seatunnel-web-jdbc-drivers:
