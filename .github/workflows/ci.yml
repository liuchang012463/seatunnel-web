name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11+10'
          cache: maven

      - name: Grant execute permission
        run: chmod +x mvnw

      - name: Show Maven version
        run: ./mvnw --version

      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress -T 1C clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: seatunnel-web-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: yarn
          cache-dependency-path: seatunnel-web-ui/yarn.lock

      - name: Set npm and Yarn versions
        run: |
          npm install --global npm@11.17.0
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          npm --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint and typecheck
        run: yarn lint

      - name: Run unit tests
        run: yarn test --runInBand --watchAll=false

      - name: Build
        run: yarn build
