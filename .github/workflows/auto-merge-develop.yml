name: Auto-merge develop PR

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: read

jobs:
  merge:
    if: ${{ github.server_url != 'https://github.com' && github.repository == 'bigdata/seatunnel-web' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # workflow_run loads this workflow from the default branch. No PR code is checked out.
      - name: Rebase and merge the verified PR
        env:
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_JOB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)
          run = event["workflow_run"]
          # Gitea reports a PR run path as ci.yml@refs/pull/<number>/head.
          match = re.fullmatch(r"ci\.yml@refs/pull/([1-9][0-9]*)/head", run.get("path", ""))
          if not match or run.get("event") != "pull_request" or run.get("conclusion") != "success":
              print("No successful PR CI run to merge")
              raise SystemExit(0)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          api = os.environ["GITEA_API_URL"].rstrip("/")
          endpoint = f"{api}/repos/bigdata/seatunnel-web/pulls/{match[1]}"
          headers = {
              "Authorization": "token " + os.environ["GITEA_JOB_TOKEN"],
              "Accept": "application/json",
              "Content-Type": "application/json",
          }
          with opener.open(urllib.request.Request(endpoint, headers=headers), timeout=15) as response:
              pr = json.load(response)
          head = pr["head"]
          base = pr["base"]
          if (pr["state"] != "open" or pr.get("draft") or pr.get("merged")
                  or base["ref"] != "develop"
                  or (head.get("repo") or {}).get("id") != base["repo"]["id"]
                  or head["sha"] != run["head_sha"]):
              print(f"PR #{match[1]} is outside the auto-merge policy or its head has changed")
              raise SystemExit(0)

          payload = json.dumps({
              "do": "rebase",
              "head_commit_id": head["sha"],
              "delete_branch_after_merge": True,
          }).encode()
          request = urllib.request.Request(endpoint + "/merge", data=payload, headers=headers)
          try:
              with opener.open(request, timeout=20):
                  print(f"Merged PR #{match[1]} and requested source branch deletion")
          except urllib.error.HTTPError as error:
              message = json.load(error).get("message", "")
              # An earlier merge may have advanced develop while this CI run was finishing.
              if error.code in (405, 409) and message in {
                  "The head branch is behind the base branch",
                  "head out of date",
                  "merge push out of date",
                  "The PR is already merged",
              }:
                  print(f"PR #{match[1]}: {message}")
              else:
                  raise RuntimeError(f"Gitea refused to merge PR #{match[1]} (HTTP {error.code}): {message}") from None
          PYTHON
