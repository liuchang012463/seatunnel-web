name: seatunnel-om-offline

x-openmetadata-server-environment: &openmetadata-server-environment
  OPENMETADATA_CLUSTER_NAME: openmetadata
  SERVER_PORT: 8585
  SERVER_ADMIN_PORT: 8586
  LOG_LEVEL: ${OM_LOG_LEVEL:-INFO}
  AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
  AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
  AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
  AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '["all"]'
  AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
  AUTHORIZER_PRINCIPAL_DOMAIN: open-metadata.org
  AUTHENTICATION_PROVIDER: basic
  AUTHENTICATION_RESPONSE_TYPE: id_token
  AUTHENTICATION_PUBLIC_KEYS: http://openmetadata-server:8585/api/v1/system/config/jwks
  AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
  JWT_ISSUER: open-metadata.org
  DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
  DB_SCHEME: mysql
  DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
  DB_USER: openmetadata_user
  DB_USER_PASSWORD: ${OM_DB_PASSWORD:?Set OM_DB_PASSWORD in .env}
  DB_HOST: openmetadata-db
  DB_PORT: 3306
  OM_DATABASE: openmetadata_db
  ELASTICSEARCH_HOST: openmetadata-elasticsearch
  ELASTICSEARCH_PORT: 9200
  ELASTICSEARCH_SCHEME: http
  SEARCH_TYPE: elasticsearch
  PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
  PIPELINE_SERVICE_CLIENT_HEALTH_CHECK_INTERVAL: 300
  SERVER_HOST_API_URL: http://openmetadata-server:8585/api
  PIPELINE_SERVICE_CLIENT_VERIFY_SSL: no-ssl
  PIPELINE_SERVICE_CLIENT_ENABLED: "true"
  PIPELINE_SERVICE_CLIENT_CLASS_NAME: org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient
  PIPELINE_SERVICE_IP_INFO_ENABLED: "false"
  PIPELINE_SERVICE_CLIENT_SECRETS_MANAGER_LOADER: noop
  AIRFLOW_USERNAME: ${OM_AIRFLOW_USERNAME:-admin}
  AIRFLOW_PASSWORD: ${OM_AIRFLOW_PASSWORD:?Set OM_AIRFLOW_PASSWORD in .env}
  AIRFLOW_TIMEOUT: 10

services:
  openmetadata-db:
    image: docker.getcollate.io/openmetadata/db:2.0.4
    platform: linux/arm64
    container_name: om204-db
    command: "--sort_buffer_size=10M"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OM_DB_ROOT_PASSWORD:?Set OM_DB_ROOT_PASSWORD in .env}
    volumes:
      - om-db-data:/var/lib/mysql
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --silent --execute 'use openmetadata_db'"]
      interval: 15s
      timeout: 10s
      retries: 10

  openmetadata-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    platform: linux/arm64
    container_name: om204-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "false"
    volumes:
      - om-es-data:/usr/share/elasticsearch/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health' | grep -Eq 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 10

  openmetadata-migrate:
    image: docker.getcollate.io/openmetadata/server:2.0.4
    platform: linux/arm64
    container_name: om204-migrate
    command: ["./bootstrap/openmetadata-ops.sh", "migrate"]
    environment: *openmetadata-server-environment
    depends_on:
      openmetadata-db:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_healthy
    networks: [platform]
    restart: "no"

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:2.0.4
    platform: linux/arm64
    container_name: om204-server
    restart: unless-stopped
    environment: *openmetadata-server-environment
    ports:
      - "${OM_HOST_PORT:-18585}:8585"
      - "${OM_ADMIN_HOST_PORT:-18586}:8586"
    depends_on:
      openmetadata-db:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    networks: [platform]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  openmetadata-ingestion:
    image: ${OPENMETADATA_INGESTION_IMAGE:-openmetadata/ingestion:2.0.4-kingbase-dameng-vastbase-custom}
    platform: linux/arm64
    container_name: om204-ingestion
    restart: unless-stopped
    entrypoint: /bin/bash
    command: ["/opt/airflow/ingestion_dependency.sh"]
    environment:
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: /opt/airflow/dag_generated_configs
      DB_HOST: openmetadata-db
      DB_PORT: 3306
      AIRFLOW_DB: airflow_db
      DB_SCHEME: mysql+mysqldb
      DB_USER: airflow_user
      DB_PASSWORD: ${OM_AIRFLOW_DB_PASSWORD:?Set OM_AIRFLOW_DB_PASSWORD in .env}
      FERNET_KEY: ${OM_AIRFLOW_FERNET_KEY:?Set OM_AIRFLOW_FERNET_KEY in .env}
    volumes:
      - om-ingestion-dag-configs:/opt/airflow/dag_generated_configs
      - om-ingestion-dags:/opt/airflow/dags
      - om-ingestion-tmp:/tmp
    depends_on:
      openmetadata-db:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_healthy
      openmetadata-server:
        condition: service_started
    networks: [platform]

  seatunnel-master:
    image: apache/seatunnel:3.0.0
    platform: linux/arm64
    container_name: st300-master
    restart: unless-stopped
    environment:
      ST_DOCKER_MEMBER_LIST: seatunnel-master:5801,seatunnel-worker-1:5801,seatunnel-worker-2:5801
    entrypoint: ["/bin/sh", "-c", "/opt/seatunnel/bin/seatunnel-cluster.sh -r master"]
    ports:
      - "${ST_ENGINE_PORT:-5802}:5801"
      - "${ST_REST_PORT:-8083}:8080"
    volumes:
      - ./seatunnel/connectors:/opt/seatunnel/connectors:ro
      - ./seatunnel/lib:/opt/seatunnel/lib:ro
      - st-logs:/opt/seatunnel/logs
    networks: [platform]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/overview"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  seatunnel-worker-1:
    image: apache/seatunnel:3.0.0
    platform: linux/arm64
    container_name: st300-worker-1
    restart: unless-stopped
    environment:
      ST_DOCKER_MEMBER_LIST: seatunnel-master:5801,seatunnel-worker-1:5801,seatunnel-worker-2:5801
    entrypoint: ["/bin/sh", "-c", "/opt/seatunnel/bin/seatunnel-cluster.sh -r worker"]
    volumes:
      - ./seatunnel/connectors:/opt/seatunnel/connectors:ro
      - ./seatunnel/lib:/opt/seatunnel/lib:ro
      - st-logs:/opt/seatunnel/logs
    depends_on:
      seatunnel-master:
        condition: service_healthy
    networks: [platform]

  seatunnel-worker-2:
    image: apache/seatunnel:3.0.0
    platform: linux/arm64
    container_name: st300-worker-2
    restart: unless-stopped
    environment:
      ST_DOCKER_MEMBER_LIST: seatunnel-master:5801,seatunnel-worker-1:5801,seatunnel-worker-2:5801
    entrypoint: ["/bin/sh", "-c", "/opt/seatunnel/bin/seatunnel-cluster.sh -r worker"]
    volumes:
      - ./seatunnel/connectors:/opt/seatunnel/connectors:ro
      - ./seatunnel/lib:/opt/seatunnel/lib:ro
      - st-logs:/opt/seatunnel/logs
    depends_on:
      seatunnel-master:
        condition: service_healthy
    networks: [platform]

volumes:
  om-db-data:
  om-es-data:
  om-ingestion-dag-configs:
  om-ingestion-dags:
  om-ingestion-tmp:
  st-logs:

networks:
  platform:
    name: seatunnel-om-offline
    driver: bridge
