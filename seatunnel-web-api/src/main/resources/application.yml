server:
  port: ${SERVER_PORT:9527}
  tomcat:
    accept-count: 1000
    max-connections: 10000

security:
  authentication:
    mode: ${SEATUNNEL_WEB_AUTH_MODE:DEV_BYPASS}
    type: PASSWORD
  dev-user-id: ${SEATUNNEL_WEB_DEV_USER_ID:1}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  banner:
    charset: UTF-8
  jackson:
    time-zone: GMT+8
    date-format: "yyyy-MM-dd HH:mm:ss"
  servlet:
    multipart:
      max-file-size: ${SEATUNNEL_WEB_MAX_FILE_SIZE:200MB}
      max-request-size: ${SEATUNNEL_WEB_MAX_REQUEST_SIZE:200MB}
  messages:
    basename: i18n/messages
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: seatunnel-web
      connection-timeout: 15000
      validation-timeout: 5000
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration/{vendor}
    table: t_seatunnel_web_schema_history
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1.0.0}
    baseline-description: SeaTunnel Web legacy schema baseline
    repair-on-migrate: ${SPRING_FLYWAY_REPAIR_ON_MIGRATE:false}
    placeholder-replacement: false
  application:
    name: seatunnel-web
  main:
    allow-bean-definition-overriding: true
  ai:
    llm:
      api-key: ${SPRING_AI_API_KEY:}
      base-url: ${SPRING_AI_BASE_URL:}
      chat:
        options:
          model: ${SPRING_AI_LLM_MODEL:}
      embedding:
        enabled: false

  quartz:
    auto-startup: true
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: seatunnel-web
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.makeSchedulerThreadDaemon: true

      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 5000
      org.quartz.jobStore.acquireTriggersWithinLock: true
      org.quartz.jobStore.useProperties: false
      org.quartz.jobStore.misfireThreshold: 60000

      org.quartz.scheduler.batchTriggerAcquisitionMaxCount: 25

      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      org.quartz.threadPool.threadCount: 10
      org.quartz.threadPool.threadPriority: 5


logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    enabled-by-default: false

# Mybatis-plus configuration, you don't need to change it
mybatis-plus:
  mapper-locations: classpath:org/apache/seatunnel/web/dao/mapper/*Mapper.xml
  type-aliases-package: org.apache.seatunnel.web.dao.entity
  configuration:
    cache-enabled: false
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
  global-config:
    db-config:
      id-type: auto
    banner: false

seatunnel:
  metrics:
    interval-ms: 2000
    log-every-times: 10
    max-monitor-ms: 1800000
    max-empty-times: 30
    max-error-times: 30
    no-progress-warn-ms: 300000
  result:
    poll-interval-ms: 2000
    poll-timeout-ms: 0

  streaming:
    metrics:
      interval-ms: 5000
      snapshot-interval-ms: 60000
      max-empty-times: 30
      max-error-times: 30
      log-every-times: 10
      retention-days: 7
      retention-cron: "0 20 3 * * ?"

  client:
    health-check:
      enabled: true
      initial-delay-ms: 15000
      fixed-delay-ms: 30000
      unhealthy-threshold: 3

  job:
    log-dir: logs

    # Maximum file size allowed for a single log query: 50MB
    max-log-query-bytes: 52428800

    recovery:
      enabled: true
      initial-delay-ms: 60000
      fixed-delay-ms: 60000
  web:
    database:
      type: ${SEATUNNEL_WEB_DATABASE_TYPE:mysql}
    file-upload:
      minio:
        endpoint: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ENDPOINT:}
        runtime-endpoint: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ENDPOINT:}
        bucket: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_BUCKET:seatunnel-web-upload}
        access-key: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ACCESS_KEY:}
        secret-key: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SECRET_KEY:}
        runtime-access-key: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ACCESS_KEY:}
        runtime-secret-key: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_SECRET_KEY:}
        root-prefix: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ROOT_PREFIX:seatunnel-web-upload}
        session-ttl-hours: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SESSION_TTL_HOURS:24}

  # The lake control plane is opt-in and uses an existing Doris DataSource.
  # Credentials remain in t_seatunnel_web_datasource and are never copied here.
  lake:
    enabled: ${SEATUNNEL_LAKE_ENABLED:false}
    data-source-id: ${SEATUNNEL_LAKE_DATASOURCE_ID:}
    operation-stale-after: ${SEATUNNEL_LAKE_OPERATION_STALE_AFTER:15m}
    query-timeout: ${SEATUNNEL_LAKE_QUERY_TIMEOUT:30s}
    # Required when enabled. P0 consumes tokens in this Web process only;
    # multi-instance deployments must add shared consume storage/routing later.
    preview-token-secret: ${SEATUNNEL_LAKE_PREVIEW_TOKEN_SECRET:}
    # Dedicated server secret for HMAC credential revisions.  It is never
    # copied into a catalog desired spec or a response.
    catalog-credential-secret: ${SEATUNNEL_LAKE_CATALOG_CREDENTIAL_SECRET:}
    preview-token-ttl: ${SEATUNNEL_LAKE_PREVIEW_TOKEN_TTL:5m}
    max-rows: ${SEATUNNEL_LAKE_MAX_ROWS:10000}
    max-bytes: ${SEATUNNEL_LAKE_MAX_BYTES:10485760}
    driver-url: ${SEATUNNEL_LAKE_DORIS_DRIVER_URL:}
    driver-class: ${SEATUNNEL_LAKE_DORIS_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}
    driver-checksum: ${SEATUNNEL_LAKE_DORIS_DRIVER_CHECKSUM:}
    # Logical JDBC catalog drivers are server-owned.  MySQL is the only
    # current default; a driver is usable only after operators set verified.
    jdbc-catalog:
      registry-revision: ${SEATUNNEL_LAKE_JDBC_CATALOG_REGISTRY_REVISION:}
      mysql:
        enabled: ${SEATUNNEL_LAKE_JDBC_CATALOG_MYSQL_ENABLED:false}
        url: ${SEATUNNEL_LAKE_JDBC_CATALOG_MYSQL_URL:}
        driver-class: ${SEATUNNEL_LAKE_JDBC_CATALOG_MYSQL_DRIVER_CLASS:com.mysql.cj.jdbc.Driver}
        checksum: ${SEATUNNEL_LAKE_JDBC_CATALOG_MYSQL_CHECKSUM:}
        verified: ${SEATUNNEL_LAKE_JDBC_CATALOG_MYSQL_VERIFIED:false}
      # PostgreSQL/Oracle remain explicitly disabled until a server-side
      # registry entry is complete and verified.
      postgresql:
        enabled: ${SEATUNNEL_LAKE_JDBC_CATALOG_POSTGRESQL_ENABLED:false}
        url: ${SEATUNNEL_LAKE_JDBC_CATALOG_POSTGRESQL_URL:}
        driver-class: ${SEATUNNEL_LAKE_JDBC_CATALOG_POSTGRESQL_DRIVER_CLASS:org.postgresql.Driver}
        checksum: ${SEATUNNEL_LAKE_JDBC_CATALOG_POSTGRESQL_CHECKSUM:}
        verified: ${SEATUNNEL_LAKE_JDBC_CATALOG_POSTGRESQL_VERIFIED:false}
      oracle:
        enabled: ${SEATUNNEL_LAKE_JDBC_CATALOG_ORACLE_ENABLED:false}
        url: ${SEATUNNEL_LAKE_JDBC_CATALOG_ORACLE_URL:}
        driver-class: ${SEATUNNEL_LAKE_JDBC_CATALOG_ORACLE_DRIVER_CLASS:oracle.jdbc.OracleDriver}
        checksum: ${SEATUNNEL_LAKE_JDBC_CATALOG_ORACLE_CHECKSUM:}
        verified: ${SEATUNNEL_LAKE_JDBC_CATALOG_ORACLE_VERIFIED:false}
    connection-pool:
      maximum-pool-size: ${SEATUNNEL_LAKE_POOL_MAX_SIZE:4}
      minimum-idle: ${SEATUNNEL_LAKE_POOL_MIN_IDLE:0}
      connection-timeout: ${SEATUNNEL_LAKE_POOL_CONNECTION_TIMEOUT:10s}
      validation-timeout: ${SEATUNNEL_LAKE_POOL_VALIDATION_TIMEOUT:5s}

# OpenMetadata integration is intentionally opt-in. The base URL must be the
# OpenMetadata Server /api endpoint; this application never calls Airflow.
metadata:
  openmetadata:
    enabled: ${METADATA_OPENMETADATA_ENABLED:false}
    base-url: ${METADATA_OPENMETADATA_BASE_URL:}
    token: ${METADATA_OPENMETADATA_TOKEN:}
    connect-timeout-ms: ${METADATA_OPENMETADATA_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${METADATA_OPENMETADATA_READ_TIMEOUT_MS:10000}
    expected-server-version: 1.12.10
    expected-ingestion-patch: 1.12.10.0
    kingbase-tunnel-host: ${METADATA_OPENMETADATA_KINGBASE_TUNNEL_HOST:}
    kingbase-tunnel-port: ${METADATA_OPENMETADATA_KINGBASE_TUNNEL_PORT:0}
  # Optional server-side adapter for /mnt/lc/open_metadata_extension/project.
  # Set the base URL to the extension's /omext route, not its OpenMetadata URL.
  extension:
    enabled: ${METADATA_OPENMETADATA_EXTENSION_ENABLED:false}
    base-url: ${METADATA_OPENMETADATA_EXTENSION_BASE_URL:}
    connect-timeout-ms: ${METADATA_OPENMETADATA_EXTENSION_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${METADATA_OPENMETADATA_EXTENSION_READ_TIMEOUT_MS:15000}
  reconcile:
    interval-ms: ${METADATA_RECONCILE_INTERVAL_MS:20000}
    batch-size: ${METADATA_RECONCILE_BATCH_SIZE:20}
    lease-seconds: ${METADATA_RECONCILE_LEASE_SECONDS:60}
    max-retry-count: ${METADATA_RECONCILE_MAX_RETRY_COUNT:4}
  status:
    interval-ms: ${METADATA_STATUS_INTERVAL_MS:10000}
    batch-size: ${METADATA_STATUS_BATCH_SIZE:50}
    idle-refresh-seconds: ${METADATA_STATUS_IDLE_REFRESH_SECONDS:60}
    trigger-grace-seconds: ${METADATA_STATUS_TRIGGER_GRACE_SECONDS:60}
