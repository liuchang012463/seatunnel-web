server:
  port: ${SERVER_PORT:9527}
  tomcat:
    accept-count: 1000
    max-connections: 10000

security:
  authentication:
    mode: ${SEATUNNEL_WEB_AUTH_MODE:DEV_BYPASS}
    type: PASSWORD
  dev-user-id: ${SEATUNNEL_WEB_DEV_USER_ID:1}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:3000}
      lettuce:
        pool:
          enabled: ${REDIS_POOL_ENABLED:false}
  banner:
    charset: UTF-8
  jackson:
    time-zone: GMT+8
    date-format: "yyyy-MM-dd HH:mm:ss"
  servlet:
    multipart:
      max-file-size: ${SEATUNNEL_WEB_MAX_FILE_SIZE:200MB}
      max-request-size: ${SEATUNNEL_WEB_MAX_REQUEST_SIZE:200MB}
  messages:
    basename: i18n/messages
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: seatunnel-web
      connection-timeout: 15000
      validation-timeout: 5000
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration/{vendor}
    table: t_seatunnel_web_schema_history
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1.0.0}
    baseline-description: SeaTunnel Web legacy schema baseline
    repair-on-migrate: ${SPRING_FLYWAY_REPAIR_ON_MIGRATE:false}
    placeholder-replacement: false
  application:
    name: seatunnel-web
  main:
    allow-bean-definition-overriding: true
  ai:
    llm:
      api-key: ${SPRING_AI_API_KEY:}
      base-url: ${SPRING_AI_BASE_URL:}
      chat:
        options:
          model: ${SPRING_AI_LLM_MODEL:}
      embedding:
        enabled: false

  quartz:
    auto-startup: true
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: seatunnel-web
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.makeSchedulerThreadDaemon: true

      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 5000
      org.quartz.jobStore.acquireTriggersWithinLock: true
      org.quartz.jobStore.useProperties: false
      org.quartz.jobStore.misfireThreshold: 60000

      org.quartz.scheduler.batchTriggerAcquisitionMaxCount: 25

      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      org.quartz.threadPool.threadCount: 10
      org.quartz.threadPool.threadPriority: 5


logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    enabled-by-default: false

# Mybatis-plus configuration, you don't need to change it
mybatis-plus:
  mapper-locations: classpath:org/apache/seatunnel/web/dao/mapper/*Mapper.xml
  type-aliases-package: org.apache.seatunnel.web.dao.entity
  configuration:
    cache-enabled: false
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
  global-config:
    db-config:
      id-type: auto
    banner: false

seatunnel:
  metrics:
    interval-ms: 2000
    log-every-times: 10
    max-monitor-ms: 1800000
    max-empty-times: 30
    max-error-times: 30
    no-progress-warn-ms: 300000
  result:
    poll-interval-ms: 2000
    poll-timeout-ms: 0

  streaming:
    metrics:
      interval-ms: 5000
      snapshot-interval-ms: 60000
      max-empty-times: 30
      max-error-times: 30
      log-every-times: 10
      retention-days: 7
      retention-cron: "0 20 3 * * ?"

  client:
    health-check:
      enabled: true
      initial-delay-ms: 15000
      fixed-delay-ms: 30000
      unhealthy-threshold: 3

  job:
    log-dir: logs

    # Maximum file size allowed for a single log query: 50MB
    max-log-query-bytes: 52428800

    recovery:
      enabled: true
      initial-delay-ms: 60000
      fixed-delay-ms: 60000

  # Generic message push/pull endpoints (/api/v1/message/**).
  # No API key: these endpoints are open to any caller that can reach the port.
  # Broker credentials come from this block (or env overrides), not from the request body.
  message:
    broker:
      host: ${SEATUNNEL_MESSAGE_BROKER_HOST:127.0.0.1}
      port: ${SEATUNNEL_MESSAGE_BROKER_PORT:5672}
      virtual-host: ${SEATUNNEL_MESSAGE_BROKER_VHOST:/}
      username: ${SEATUNNEL_MESSAGE_BROKER_USERNAME:admin}
      password: ${SEATUNNEL_MESSAGE_BROKER_PASSWORD:rabbitmq123}
      ssl-enabled: ${SEATUNNEL_MESSAGE_BROKER_SSL_ENABLED:false}
      connection-timeout-ms: ${SEATUNNEL_MESSAGE_BROKER_CONNECTION_TIMEOUT_MS:10000}
    # Maximum accepted payload size: 1MB
    max-body-bytes: ${SEATUNNEL_MESSAGE_MAX_BODY_BYTES:1048576}
    # Hard ceiling on one pull, regardless of what the caller requests
    max-batch-size: ${SEATUNNEL_MESSAGE_MAX_BATCH_SIZE:100}
    pull-default-timeout-ms: ${SEATUNNEL_MESSAGE_PULL_DEFAULT_TIMEOUT_MS:3000}
    # Payload structure is caller-defined, so parse limits are tightened below
    # Jackson's defaults (1000 depth).
    max-nesting-depth: ${SEATUNNEL_MESSAGE_MAX_NESTING_DEPTH:200}
    max-string-length: ${SEATUNNEL_MESSAGE_MAX_STRING_LENGTH:1048576}
    max-number-length: ${SEATUNNEL_MESSAGE_MAX_NUMBER_LENGTH:1000}
    # Best-effort MQ notify after file-resource upload.
    # Empty exchange = AMQP default exchange (routing key = queue name).
    file-mq:
      enabled: ${SEATUNNEL_MESSAGE_FILE_MQ_ENABLED:true}
      exchange: ${SEATUNNEL_MESSAGE_FILE_MQ_EXCHANGE:}
      routing-key: ${SEATUNNEL_MESSAGE_FILE_MQ_ROUTING_KEY:order.sync}

  web:
    database:
      type: ${SEATUNNEL_WEB_DATABASE_TYPE:mysql}
    file-upload:
      minio:
        endpoint: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ENDPOINT:}
        runtime-endpoint: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ENDPOINT:}
        bucket: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_BUCKET:seatunnel-web-upload}
        access-key: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ACCESS_KEY:}
        secret-key: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SECRET_KEY:}
        runtime-access-key: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_ACCESS_KEY:}
        runtime-secret-key: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_RUNTIME_SECRET_KEY:}
        root-prefix: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_ROOT_PREFIX:seatunnel-web-upload}
        session-ttl-hours: ${SEATUNNEL_WEB_FILE_UPLOAD_MINIO_SESSION_TTL_HOURS:24}
    file-resource:
      storage:
        provider: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_PROVIDER:S3_COMPATIBLE}
        endpoint: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_ENDPOINT:}
        runtime-endpoint: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_RUNTIME_ENDPOINT:}
        upload-endpoint: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_UPLOAD_ENDPOINT:}
        region: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_REGION:us-east-1}
        bucket: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_BUCKET:}
        access-key: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_ACCESS_KEY:}
        secret-key: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_SECRET_KEY:}
        runtime-access-key: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_RUNTIME_ACCESS_KEY:}
        runtime-secret-key: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_RUNTIME_SECRET_KEY:}
        root-prefix: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_ROOT_PREFIX:seatunnel-web-resource}
        credential-mode: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_CREDENTIAL_MODE:STATIC}
        path-style-access: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_PATH_STYLE_ACCESS:true}
        connect-timeout-ms: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_CONNECT_TIMEOUT_MS:10000}
        request-timeout-ms: ${SEATUNNEL_WEB_FILE_RESOURCE_STORAGE_REQUEST_TIMEOUT_MS:30000}
    duckdb:
      init-sql-dir: ${SEATUNNEL_WEB_DUCKDB_INIT_SQL_DIR:}

# OpenMetadata Server connection is managed only in 运行运维 → 探查引擎管理.
# The metadata.openmetadata.* fields below are unused at runtime (legacy shape
# retained for unit-test helpers). Extension and schedulers still use env.
metadata:
  openmetadata:
    base-url:
    token:
    connect-timeout-ms: 10000
    read-timeout-ms: 60000
    expected-server-version: 2.0.4
    expected-ingestion-patch: 2.0.4.0
  # Optional server-side adapter for /mnt/lc/open_metadata_extension/project.
  # Set the base URL to the extension's /omext route, not its OpenMetadata URL.
  extension:
    enabled: ${METADATA_OPENMETADATA_EXTENSION_ENABLED:false}
    base-url: ${METADATA_OPENMETADATA_EXTENSION_BASE_URL:}
    connect-timeout-ms: ${METADATA_OPENMETADATA_EXTENSION_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${METADATA_OPENMETADATA_EXTENSION_READ_TIMEOUT_MS:60000}
  reconcile:
    interval-ms: ${METADATA_RECONCILE_INTERVAL_MS:20000}
    batch-size: ${METADATA_RECONCILE_BATCH_SIZE:20}
    lease-seconds: ${METADATA_RECONCILE_LEASE_SECONDS:60}
    max-retry-count: ${METADATA_RECONCILE_MAX_RETRY_COUNT:4}
  status:
    interval-ms: ${METADATA_STATUS_INTERVAL_MS:10000}
    batch-size: ${METADATA_STATUS_BATCH_SIZE:50}
    idle-refresh-seconds: ${METADATA_STATUS_IDLE_REFRESH_SECONDS:60}
    trigger-grace-seconds: ${METADATA_STATUS_TRIGGER_GRACE_SECONDS:120}
    exploration-preparation-timeout-seconds: ${METADATA_STATUS_EXPLORATION_PREPARATION_TIMEOUT_SECONDS:1800}
    exploration-trigger-retry-timeout-seconds: ${METADATA_STATUS_EXPLORATION_TRIGGER_RETRY_TIMEOUT_SECONDS:1200}
  # Shared cache for OpenMetadata reads and data-inventory aggregates.
  # type=redis keeps snapshots across restarts and processes; type=memory
  # preserves the old process-local behavior (used by unit tests).
  inventory:
    cache-type: ${METADATA_INVENTORY_CACHE_TYPE:memory}
    soft-ttl-ms: ${METADATA_INVENTORY_SOFT_TTL_MS:300000}
    stale-ttl-ms: ${METADATA_INVENTORY_STALE_TTL_MS:1800000}
    warm-interval-ms: ${METADATA_INVENTORY_WARM_INTERVAL_MS:60000}
  om-read-cache:
    enabled: ${METADATA_OM_READ_CACHE_ENABLED:true}
    page-ttl-ms: ${METADATA_OM_READ_CACHE_PAGE_TTL_MS:600000}
    profile-ttl-ms: ${METADATA_OM_READ_CACHE_PROFILE_TTL_MS:900000}
