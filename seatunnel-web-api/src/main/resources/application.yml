server:
  port: ${SERVER_PORT:9527}
  tomcat:
    accept-count: 1000
    max-connections: 10000

security:
  authentication:
    mode: ${SEATUNNEL_WEB_AUTH_MODE:DEV_BYPASS}
  dev-user-id: ${SEATUNNEL_WEB_DEV_USER_ID:1}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  banner:
    charset: UTF-8
  jackson:
    time-zone: GMT+8
    date-format: "yyyy-MM-dd HH:mm:ss"
  servlet:
    multipart:
      max-file-size: ${SEATUNNEL_WEB_MAX_FILE_SIZE:200MB}
      max-request-size: ${SEATUNNEL_WEB_MAX_REQUEST_SIZE:200MB}
  messages:
    basename: i18n/messages
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: seatunnel-web
      connection-timeout: 15000
      validation-timeout: 5000
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration/{vendor}
    table: t_seatunnel_web_schema_history
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1.0.0}
    baseline-description: SeaTunnel Web legacy schema baseline
    repair-on-migrate: ${SPRING_FLYWAY_REPAIR_ON_MIGRATE:false}
    placeholder-replacement: false
  application:
    name: seatunnel-web
  main:
    allow-bean-definition-overriding: true
  ai:
    minimax:
      api-key: ${SPRING_AI_API_KEY}
      base-url: ${SPRING_AI_BASE_URL}
      chat:
        options:
          model: ${SPRING_AI_LLM_MODEL}
      embedding:
        enabled: false

  quartz:
    auto-startup: true
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: seatunnel-web
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.makeSchedulerThreadDaemon: true

      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 5000
      org.quartz.jobStore.acquireTriggersWithinLock: true
      org.quartz.jobStore.useProperties: false
      org.quartz.jobStore.misfireThreshold: 60000

      org.quartz.scheduler.batchTriggerAcquisitionMaxCount: 25

      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      org.quartz.threadPool.threadCount: 10
      org.quartz.threadPool.threadPriority: 5


logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    enabled-by-default: false

# Mybatis-plus configuration, you don't need to change it
mybatis-plus:
  mapper-locations: classpath:org/apache/seatunnel/web/dao/mapper/*Mapper.xml
  type-aliases-package: org.apache.seatunnel.web.dao.entity
  configuration:
    cache-enabled: false
    call-setters-on-nulls: true
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
  global-config:
    db-config:
      id-type: auto
    banner: false

seatunnel:
  metrics:
    interval-ms: 2000
    log-every-times: 10
    max-monitor-ms: 1800000
    max-empty-times: 30
    max-error-times: 30
    no-progress-warn-ms: 300000

  streaming:
    metrics:
      interval-ms: 5000
      max-empty-times: 30
      max-error-times: 30
      log-every-times: 10
      retention-days: 7
      retention-cron: "0 20 3 * * ?"

  client:
    health-check:
      enabled: true
      initial-delay-ms: 15000
      fixed-delay-ms: 30000
      unhealthy-threshold: 3

  job:
    log-dir: logs

    # Maximum file size allowed for a single log query: 50MB
    max-log-query-bytes: 52428800

    recovery:
      enabled: true
      initial-delay-ms: 60000
      fixed-delay-ms: 60000
  web:
    database:
      type: ${SEATUNNEL_WEB_DATABASE_TYPE:mysql}

# OpenMetadata integration is intentionally opt-in. The base URL must be the
# OpenMetadata Server /api endpoint; this application never calls Airflow.
metadata:
  openmetadata:
    enabled: ${METADATA_OPENMETADATA_ENABLED:false}
    base-url: ${METADATA_OPENMETADATA_BASE_URL:}
    token: ${METADATA_OPENMETADATA_TOKEN:}
    connect-timeout-ms: ${METADATA_OPENMETADATA_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${METADATA_OPENMETADATA_READ_TIMEOUT_MS:10000}
    expected-server-version: 1.12.10
    expected-ingestion-patch: 1.12.10.0
    kingbase-tunnel-host: ${METADATA_OPENMETADATA_KINGBASE_TUNNEL_HOST:}
    kingbase-tunnel-port: ${METADATA_OPENMETADATA_KINGBASE_TUNNEL_PORT:0}
  reconcile:
    interval-ms: ${METADATA_RECONCILE_INTERVAL_MS:20000}
    batch-size: ${METADATA_RECONCILE_BATCH_SIZE:20}
    lease-seconds: ${METADATA_RECONCILE_LEASE_SECONDS:60}
    max-retry-count: ${METADATA_RECONCILE_MAX_RETRY_COUNT:4}
  status:
    interval-ms: ${METADATA_STATUS_INTERVAL_MS:10000}
    batch-size: ${METADATA_STATUS_BATCH_SIZE:50}
    idle-refresh-seconds: ${METADATA_STATUS_IDLE_REFRESH_SECONDS:60}
    trigger-grace-seconds: ${METADATA_STATUS_TRIGGER_GRACE_SECONDS:60}
